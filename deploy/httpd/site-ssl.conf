<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName mindswithwings.com

    ErrorLog /var/log/httpd/mindswithwings.com-error.log
    CustomLog /var/log/httpd/mindswithwings.com-access.log combined

    RewriteEngine On

    ProxyPreserveHost On
    ProxyErrorOverride Off

    ProxyPass / http://localhost:5173/
    ProxyPassReverse / http://localhost:5173/

    SSLCertificateFile /etc/letsencrypt/live/mindswithwings.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/mindswithwings.com/privkey.pem
</VirtualHost>
</IfModule>
