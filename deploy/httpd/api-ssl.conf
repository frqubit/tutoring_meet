<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName api.mindswithwings.com

    ErrorLog /var/log/httpd/api.mindswithwings.com-error.log
    CustomLog /var/log/httpd/api.mindswithwings.com-access.log combined

    RewriteEngine On

    ProxyPreserveHost On
    ProxyErrorOverride Off

    ProxyPass / http://localhost:3000/
    ProxyPassReverse / http://localhost:3000/

    SSLCertificateFile /etc/letsencrypt/live/api.mindswithwings.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/api.mindswithwings.com/privkey.pem
</VirtualHost>
</IfModule>
